[project]
name = "smc-trading-engine"
version = "0.1.0"
description = "SMC (Smart Money Concepts) trading engine — core/domain, contracts, config, events, state (Milestone 1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "news"]
